# The Python tests and the app's type check, on each OS the installers are built for, for every push
# and pull request to main.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"   # the Python proki is tested on
      PYTHONUTF8: "1"     # files read as UTF-8, as the shipped engine reads them (not Windows' code page)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: uv run pytest -q
      - run: npm ci && npx tsc -b
        working-directory: ui
