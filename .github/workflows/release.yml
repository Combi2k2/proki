# proki's installers, built on each OS by packaging/build.sh: the macOS .dmg (Apple silicon) and the
# Windows installer. Run it by hand for a build to try (the Actions run keeps them), or push a tag
# like v0.1.0 for a release that carries them.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       made: "ui/app/target/release/bundle/dmg/*.dmg" }
          - { os: windows-latest, made: "ui/app/target/release/bundle/nsis/*.exe" }
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"   # the Python proki is tested on
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ui/app }
      - run: bash packaging/build.sh
        shell: bash
      - uses: actions/upload-artifact@v7
        with: { name: "proki-${{ matrix.os }}", path: "${{ matrix.made }}", if-no-files-found: error }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with: { files: "${{ matrix.made }}" }
