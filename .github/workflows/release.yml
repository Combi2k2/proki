# proki's installers, built on each OS by packaging/build.sh: the macOS .dmg (Apple silicon) and the
# Windows installer. Run it by hand for a build to try (the Actions run keeps them), or push a tag
# like v0.1.0 for a release that carries them. The tests run in test.yml, on every push to main.
#
# The macOS app is signed with the certificate in the secrets APPLE_CERTIFICATE (a .p12, base64),
# APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY (its name), made by packaging/signing-cert.sh, so
# macOS keeps the permissions it was given from one release to the next; without them it's signed ad hoc.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       made: "ui/app/target/release/bundle/dmg/*.dmg" }
          - { os: windows-latest, made: "ui/app/target/release/bundle/nsis/*.exe" }
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"   # the Python proki is tested on
      PYTHONUTF8: "1"     # files read as UTF-8, as the shipped engine reads them (not Windows' code page)
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ui/app }
      - name: The signing certificate, in a keychain of its own and trusted for signing code
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/proki.p12"
          security create-keychain -p ci "$kc" && security set-keychain-settings "$kc" && security unlock-keychain -p ci "$kc"
          security import "$RUNNER_TEMP/proki.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          openssl pkcs12 -in "$RUNNER_TEMP/proki.p12" -nokeys -passin env:APPLE_CERTIFICATE_PASSWORD -out "$RUNNER_TEMP/proki.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/proki.pem"
          rm "$RUNNER_TEMP/proki.p12"
      - run: bash packaging/build.sh
        shell: bash
      - uses: actions/upload-artifact@v7
        with: { name: "proki-${{ matrix.os }}", path: "${{ matrix.made }}", if-no-files-found: error }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with: { files: "${{ matrix.made }}" }
