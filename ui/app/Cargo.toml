[package]
name = "proki-ui"
version = "0.1.0"
description = "proki's UI: the tray, the popup and the windows. The engine (Python) starts it."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-nats = "0.50.0"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.3", features = ["time", "sync", "fs"] }
toml = "1.1.8"
