[project]
name = "proki"
version = "0.1.0"
description = "procrastination killer: watches how you work and nudges you at the right moment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4",
    "python-dotenv>=1",
    "requests>=2.31",
    "PySide6>=6.6",
    "numpy>=2.4.6",
]

[project.scripts]
proki = "proki.legacy.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# tests/test_packaging.py checks this list
packages = [
    "proki",
    "proki.core",
    "proki.core.ops",
    "proki.core.signals",
    "proki.platforms",
    "proki.services",
    "proki.services.activitywatch",
    "proki.legacy",
    "proki.legacy.commands",
    "proki.legacy.core",
    "proki.legacy.flows",
    "proki.legacy.focus",
    "proki.legacy.metrics",
    "proki.legacy.rules",
    "proki.legacy.ui",
]

[tool.setuptools.package-data]
proki = ["assets/sounds/*", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
